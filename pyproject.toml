[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tracesentinel"
version = "0.3.0"
description = "Evidence-first authentication log detection and offline investigation reports"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.scripts]
tracesentinel = "tracesentinel.cli:main"

[tool.setuptools.packages.find]
include = ["tracesentinel*"]
